[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bsc-audit-engine"
dynamic = ["version"]
description = "Certificate-producing audit engine for typed scientific claims"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "J. Tree"}]
keywords = ["scientific audit", "exact arithmetic", "chain complexes", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jkolantree/octo"
Documentation = "https://github.com/jkolantree/octo/blob/main/docs/index.md"
Issues = "https://github.com/jkolantree/octo/issues"
Changelog = "https://github.com/jkolantree/octo/blob/main/CHANGELOG.md"

[project.scripts]
bsc-audit = "bsc_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bsc_audit.__version__"}

[tool.setuptools.package-data]
bsc_audit = ["schema_data/*.json"]
