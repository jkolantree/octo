name: exact-release

on:
  push:
    tags:
      - "v0.3.0-alpha.*"

concurrency:
  group: exact-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.repository == 'jkolantree/octo'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the exact release Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.13"
      - name: Set up the exact Return Desk Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Install the exact build backend
        run: python -m pip install --disable-pip-version-check "setuptools==82.0.1"
      - name: Require one annotated tag at the exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -f "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
      - name: Build and gate the exact clean-tag release
        run: python scripts/build_release.py --output release
      - name: Verify the closed release directory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_directory.py release \
            --commit "$GITHUB_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --tag "$GITHUB_REF_NAME" \
            --expected-count 17
      - name: Create keyless provenance for every release asset
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: "${{ github.workspace }}/release/*"
      - name: Verify keyless provenance before creating a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for artifact in release/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$ATTESTATION_BUNDLE" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --deny-self-hosted-runners
          done
      - name: Create a draft release with the attested bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --latest=false \
            --verify-tag \
            --title "BSC Audit Engine $GITHUB_REF_NAME" \
            --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
      - name: Redownload and compare every draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/release-draft-download"
          mkdir "$download"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download"
          test "$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets,isDraft,isPrerelease,tagName \
              --jq 'select(.isDraft == true and .isPrerelease == true and (.assets | length) == 17) | .tagName'
          )" = "$GITHUB_REF_NAME"
          python scripts/check_release_directory.py "$download" \
            --commit "$GITHUB_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --tag "$GITHUB_REF_NAME" \
            --expected-count 17
          for artifact in release/*; do
            cmp "$artifact" "$download/${artifact##*/}"
          done
      - name: Publish the verified prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
          test "$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets,isDraft,isPrerelease,tagName \
              --jq 'select(.isDraft == false and .isPrerelease == true and (.assets | length) == 17) | .tagName'
          )" = "$GITHUB_REF_NAME"
      - name: Verify the published assets and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/release-published-download"
          mkdir "$download"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download"
          python scripts/check_release_directory.py "$download" \
            --commit "$GITHUB_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --tag "$GITHUB_REF_NAME" \
            --expected-count 17
          for artifact in release/*; do
            name="${artifact##*/}"
            cmp "$artifact" "$download/$name"
            gh attestation verify "$download/$name" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$ATTESTATION_BUNDLE" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --deny-self-hosted-runners
          done
