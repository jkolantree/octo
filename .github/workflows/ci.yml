name: exact-audit

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: exact-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_tests.py
      - run: python scripts/run_null_discrimination.py
      - run: python scripts/check_release.py
      - run: python run_audit.py audit examples/claim_valid.json
      - run: python run_audit.py complex examples/complex_valid_transport.json
      - run: python run_audit.py atomic examples/atomic_modulus_valid.json
      - run: python run_audit.py defect examples/defect_composition_valid.json
      - name: Negative examples must fail closed
        run: |
          if python run_audit.py audit examples/claim_arithmetic_no_go.json; then exit 1; fi
          if python run_audit.py observe examples/observation_failure.json; then exit 1; fi
          if python run_audit.py audit templates/claim_manifest_template.json; then exit 1; fi

  package-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install --disable-pip-version-check "setuptools==82.0.1"
      - run: SOURCE_DATE_EPOCH=1784505600 python scripts/build_dist.py
      - name: Reproducible distributions
        run: |
          mkdir /tmp/bsc-build-a /tmp/bsc-build-b
          SOURCE_DATE_EPOCH=1784505600 python scripts/build_dist.py --outdir /tmp/bsc-build-a
          SOURCE_DATE_EPOCH=1784505600 python scripts/build_dist.py --outdir /tmp/bsc-build-b
          for artifact in /tmp/bsc-build-a/*; do
            name="${artifact##*/}"
            test -f "/tmp/bsc-build-b/$name"
            cmp "$artifact" "/tmp/bsc-build-b/$name"
          done
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: bsc-audit --version
      - run: bsc-audit audit examples/claim_valid.json
      - name: Test the source distribution payload
        run: |
          mkdir -p /tmp/bsc-sdist
          tar -xzf dist/*.tar.gz -C /tmp/bsc-sdist
          cd /tmp/bsc-sdist/bsc_audit_engine-*
          python scripts/run_tests.py
